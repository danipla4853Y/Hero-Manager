<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Heróis</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>
    <div class="container-form">
        <div class="form-header">
            <h1>🦸 Login</h1>
            <p>Entre em sua conta de heróis</p>
        </div>

        <form action="{{(url_for('login'))}}" method="post">
            <div class="form-group">
                <label for="Email_login">📧 Email</label>
                <input type="email" id="Email_login" name="Email_login" placeholder="Digite seu email" required>
            </div>

            <div class="form-group">
                <label for="Senha_login">🔐 Senha</label>
                <input type="password" id="Senha_login" name="Senha_login" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>

            <div class="form-footer">
                <p>Não tem uma conta?</p>
                <a href="{{url_for('cadastro')}}">Cadastre-se aqui →</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

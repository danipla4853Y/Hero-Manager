<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Heróis</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body>
    <div class="container-form">
        <div class="form-header">
            <h1>🦸 Cadastro</h1>
            <p>Crie sua conta para gerenciar heróis</p>
        </div>

        <form action="{{url_for('cadastro')}}" method="post">
            <div class="form-group">
                <label for="Nome_cadastro">👤 Nome</label>
                <input type="text" id="Nome_cadastro" name="Nome_cadastro" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="Email_cadastro">📧 Email</label>
                <input type="email" id="Email_cadastro" name="Email_cadastro" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="Cpf_cadastro">🆔 CPF</label>
                <input type="text" id="Cpf_cadastro" name="Cpf_cadastro" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label for="Senha_cadastro">🔐 Senha</label>
                <input type="password" id="Senha_cadastro" name="Senha_cadastro" placeholder="Digite uma senha segura" required>
            </div>

            <div class="form-group">
                <label for="Planeta_cadastro">🪐 Planeta</label>
                <input type="text" id="Planeta_cadastro" name="Planeta_cadastro" placeholder="Digite seu planeta" required>
            </div>

            <button type="submit" class="btn-submit">Salvar</button>

            <div class="form-footer">
                <p>Já tem uma conta?</p>
                <a href="{{url_for('login')}}">Faça login aqui →</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

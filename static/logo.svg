<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#heroGradient)" filter="url(#shadow)"/>
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="85" fill="white" opacity="0.95"/>
  
  <!-- Cape (left) -->
  <path d="M 70 50 Q 50 70 55 120 Q 60 130 70 125 Q 65 85 75 55 Z" fill="#667eea" opacity="0.8"/>
  
  <!-- Cape (right) -->
  <path d="M 130 50 Q 150 70 145 120 Q 140 130 130 125 Q 135 85 125 55 Z" fill="#764ba2" opacity="0.8"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="18" fill="#667eea"/>
  
  <!-- Face mask -->
  <ellipse cx="95" cy="58" rx="8" ry="10" fill="white" opacity="0.9"/>
  <ellipse cx="105" cy="58" rx="8" ry="10" fill="white" opacity="0.9"/>
  
  <!-- Eyes -->
  <circle cx="93" cy="57" r="2" fill="#667eea"/>
  <circle cx="107" cy="57" r="2" fill="#667eea"/>
  
  <!-- Mouth -->
  <path d="M 95 65 Q 100 67 105 65" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <rect x="85" y="80" width="30" height="35" rx="4" fill="#667eea"/>
  
  <!-- Chest symbol (star) -->
  <g transform="translate(100, 95)">
    <polygon points="0,-8 2.5,-2.5 8,-1 3.5,3 5,8.5 0,5 -5,8.5 -3.5,3 -8,-1 -2.5,-2.5" fill="#764ba2"/>
  </g>
  
  <!-- Arms -->
  <rect x="65" y="88" width="20" height="10" rx="5" fill="#667eea"/>
  <rect x="115" y="88" width="20" height="10" rx="5" fill="#667eea"/>
  
  <!-- Legs -->
  <rect x="88" y="118" width="8" height="25" rx="4" fill="#667eea"/>
  <rect x="104" y="118" width="8" height="25" rx="4" fill="#667eea"/>
  
  <!-- Boots -->
  <rect x="86" y="140" width="12" height="8" rx="3" fill="#764ba2"/>
  <rect x="102" y="140" width="12" height="8" rx="3" fill="#764ba2"/>
  
  <!-- Text: HEROES -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#667eea">HEROES</text>
</svg>